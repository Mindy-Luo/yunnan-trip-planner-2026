function openModal(i=null){editing=i;const f=document.getElementById('eventForm');f.reset();document.getElementById('modalTitle').textContent=i===null?'添加安排':'编辑安排';document.getElementById('deleteBtn').style.display=i===null?'none':'block';if(i!==null){let e=state.days[state.active].events[i];Object.keys(e).forEach(k=>{if(f.elements[k])f.elements[k].value=e[k]||''})}document.getElementById('overlay').classList.add('open');setTimeout(()=>f.elements.time.focus(),100)}function closeModal(){document.getElementById('overlay').classList.remove('open')}document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
document.getElementById('eventForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),obj=Object.fromEntries(f.entries());obj.platform=obj.platform||platformOf(obj);let es=state.days[state.active].events;if(editing===null)es.push(obj);else es[editing]=obj;es.sort((a,b)=>a.time.localeCompare(b.time));save();closeModal();render();toast('已保存到当天')});function deleteEditing(){if(editing===null)return;state.days[state.active].events.splice(editing,1);save();closeModal();render();toast('已删除')}
function importTransport(){const text=prompt('粘贴航司或铁路分享的完整文字：');if(!text)return;const date=text.match(/【(\d{2})月(\d{2})日】/),no=text.match(/乘坐【([A-Z]{1,3}\d{3,5}|[GDKTZC]\d{1,5})】/i),route=text.match(/从【([^】]+)】(?:飞往|前往|到达)【([^】]+)】/),url=text.match(/【(https?:\/\/[^】]+)】/);if(!date||!no||!route){alert('暂时无法识别。请保留日期、航班/车次和出发到达地点的【】符号。');return}const idx=state.days.findIndex(d=>d.date===`${Number(date[1])}/${Number(date[2])}`);if(idx<0){alert('这个日期不在当前九日行程中。');return}const code=no[1].toUpperCase(),flight=/^[A-Z]{2,3}\d/.test(code),obj={time:'待确认',end:'',title:`${code} · ${route[1]}${flight?'飞往':'前往'}${route[2]}`,kind:flight?'航班':'铁路',flightNo:flight?code:'',trainNo:flight?'':code,from:route[1],to:route[2],fromCode:flight&&route[1].includes('深圳')?'SZX':'',toCode:flight&&route[2].includes('大理')?'DLU':'',platform:flight?'航司官方':'铁路12306',link:url?url[1]:'',note:'具体时间以官方通知为准'};state.days[idx].events.unshift(obj);state.active=idx;state.tab='trip';save();render();toast(`已导入 ${code}`)}function copyFlight(i){const e=state.days[state.active].events[i],t=`${e.flightNo||''}｜${e.from||''} → ${e.to||''}｜${e.time||'时间待确认'}｜${e.link||''}`;navigator.clipboard?.writeText(t).then(()=>toast('航班信息已复制')).catch(()=>toast('请长按卡片复制'))}
function toggleCheck(id){checked=checked.includes(id)?checked.filter(x=>x!==id):[...checked,id];localStorage.setItem(CHECKKEY,JSON.stringify(checked));render()}function addPacking(ev){ev.preventDefault();const f=new FormData(ev.target),text=String(f.get('text')||'').trim();if(!text)return;packingItems.push({id:'custom-'+Date.now(),category:String(f.get('category')),text,custom:true});localStorage.setItem(PACKKEY,JSON.stringify(packingItems));render();toast('已添加到清单')}function removePacking(id){packingItems=packingItems.filter(x=>x.id!==id);checked=checked.filter(x=>x!==id);localStorage.setItem(PACKKEY,JSON.stringify(packingItems));localStorage.setItem(CHECKKEY,JSON.stringify(checked));render();toast('已移除')}
function exportData(){const blob=new Blob([JSON.stringify({version:2,days:state.days,packingItems,checked},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='云南旅行工作台-2026备份.json';a.click();URL.revokeObjectURL(a.href);toast('备份已导出')}
function importData(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.days))throw 0;state.days=x.days;if(Array.isArray(x.packingItems)){packingItems=x.packingItems;localStorage.setItem(PACKKEY,JSON.stringify(packingItems))}if(Array.isArray(x.checked)){checked=x.checked;localStorage.setItem(CHECKKEY,JSON.stringify(checked))}state.active=0;save();render();toast('备份已恢复')}catch(e){alert('无法识别这个备份文件。')}};r.readAsText(f)}function resetData(){if(confirm('确定恢复初始示例行程吗？')){state.days=JSON.parse(JSON.stringify(seed));save();render();toast('已恢复')}}render();
</script></body></html>
